{% comment %} {% extends "boulders/base.html" %} {% endcomment %}
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% block title %}Homewall{% endblock %}</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
    {%include 'navbar.html'%}
    <div class = "container mt-4">
        <div class="row">
            <div class="col-md-4">
                {% block content %}{% endblock %}
            </div>

            <div class="col-md-8">
                <div class="boulder-container">
                    <svg id="boulder-svg" width="440" height="630" xmlns="http://www.w3.org/2000/svg"></svg>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Load config.js first -->
    <script src="{% static 'js/config.js' %}"></script>
    <!-- Then common.js -->
    <script src="{% static 'js/common.js' %}"></script>
    <!-- Then wifi.js -->
    <script src="{% static 'js/wifi.js' %}"></script>
    
    {% block extra_scripts %}{% endblock %}
    
</html>
